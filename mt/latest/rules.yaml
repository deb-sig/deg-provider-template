    - id: 忽略微信支付
      when: <支付方式> ~ "微信支付"
      actions:
          from:
              account: Assets:Test:Wx
          ignore: true

    - id: 收入返利
      when: <收/支> == "收入"
      actions:
          from:
              account: Income:Rebate
