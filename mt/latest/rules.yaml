options:
    title: mt
    operatingCurrency: CNY

templateRules:
    - id: 美团基础交易
      actions:
          date: <交易创建时间>
          narration: <订单标题>
          amount: <实付金额>.number
          type: <收/支>
          currency: CNY
          metadata:
              source: 美团
              payTime: <交易创建时间> +0800 CST
              orderId: <交易单号>
              merchantId: <商家单号>
              type: <收/支>
              method: <支付方式>

    - id: 美团支出
      when: <收/支> == "支出"
      actions:
          from:
              account: Assets:FIXME
          to:
              account: Expenses:FIXME

    - id: 美团收入
      when: <收/支> == "收入"
      actions:
          from:
              account: Income:Rebate
          to:
              account: Assets:FIXME

personalRules:
    - id: 餐饮券
      when: (narration ~ "单人餐" || narration ~ "牛肉火锅" || narration ~ "江湖菜" || narration ~ "川菜" || narration ~ "肉蟹煲" || narration ~ "自助餐" || narration ~ "盖码饭" || narration ~ "米线" || narration ~ "斑鱼" || narration ~ "蛋挞" || narration ~ "湖南菜" || narration ~ "湘语" || narration ~ "一条鱼" || narration ~ "湘菜" || narration ~ "活鱼" || narration ~ "牛羊肉" || narration ~ "米粉") && <收/支> == "支出"
      actions:
          to:
              account: Expenses:Food:Meal:Coupon

    - id: 晚餐
      when: (narration ~ "单人餐" || narration ~ "牛肉火锅" || narration ~ "江湖菜" || narration ~ "川菜" || narration ~ "肉蟹煲" || narration ~ "自助餐" || narration ~ "盖码饭" || narration ~ "米线" || narration ~ "斑鱼" || narration ~ "蛋挞" || narration ~ "湖南菜" || narration ~ "湘语" || narration ~ "一条鱼" || narration ~ "湘菜" || narration ~ "活鱼" || narration ~ "牛羊肉" || narration ~ "米粉") && raw[交易创建时间].time >= "16:00" && raw[交易创建时间].time <= "21:00" && <收/支> == "支出"
      actions:
          to:
              account: Expenses:Food:Meal:Dinner

    - id: 午餐
      when: (narration ~ "单人餐" || narration ~ "牛肉火锅" || narration ~ "江湖菜" || narration ~ "川菜" || narration ~ "肉蟹煲" || narration ~ "自助餐" || narration ~ "盖码饭" || narration ~ "米线" || narration ~ "斑鱼" || narration ~ "蛋挞" || narration ~ "湖南菜" || narration ~ "湘语" || narration ~ "一条鱼" || narration ~ "湘菜" || narration ~ "活鱼" || narration ~ "牛羊肉" || narration ~ "米粉") && raw[交易创建时间].time >= "10:30" && raw[交易创建时间].time <= "14:00" && <收/支> == "支出"
      actions:
          to:
              account: Expenses:Food:Meal:Lunch

    - id: 代金券
      when: narration ~ "代金券" && <收/支> == "支出"
      actions:
          to:
              account: Expenses:Food:Meal:Coupon

    - id: 饮品甜品
      when: (narration ~ "瑞幸" || narration ~ "喜茶" || narration ~ "分甜" || narration ~ "奶茶" || narration ~ "果茶" || narration ~ "甜品" || narration ~ "中杯" || narration ~ "大杯") && <收/支> == "支出"
      actions:
          to:
              account: Expenses:Food:Snacks

    - id: 美团月付还款
      when: narration ~ "【美团月付】主动还款" && <收/支> == "支出"
      actions:
          to:
              account: Liabilities:MT:zwyyy456

    - id: 交通0354支出
      when: <支付方式> ~ "(0354)" && <收/支> == "支出"
      actions:
          from:
              account: Liabilities:CC:BCM:0354

    - id: 交通0354收入
      when: <支付方式> ~ "(0354)" && <收/支> == "收入"
      actions:
          to:
              account: Liabilities:CC:BCM:0354

    - id: 中行1341支出
      when: <支付方式> ~ "(1341)" && <收/支> == "支出"
      actions:
          from:
              account: Liabilities:CC:BoC:1341

    - id: 中行1341收入
      when: <支付方式> ~ "(1341)" && <收/支> == "收入"
