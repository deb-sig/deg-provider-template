options:
    title: 建设银行账单转换
    operatingCurrency: CNY

templateRules:
    - id: 建行基础交易
      actions:
          date: <交易日期> <交易时间>
          payee: <对方户名>
          narration: <交易地点>
          note: <摘要>
          currency: CNY
          metadata:
              source: 中国建设银行
              accountNum: xxxxx*********xxxx
              balances: <账户余额>
              currency: <币种>
              peerAccount: <对方户名>
              peerAccountNum: <对方账号>
              recordDate: <记账日>
              region: <交易地点>
              tradeTime: <交易时间>
              txType: <摘要>

    - id: 建行支出
      when: <支出> != "" && <支出> != "0"
      actions:
          amount: <支出>.number
          type: 支出
          metadata:
              expense: <支出>
              type: 支出
          from:
              account: Assets:Bank:CN:CCB:Checking
          to:
              account: Expenses:FIXME

    - id: 建行收入
      when: <收入> != "" && <收入> != "0"
      actions:
          amount: <收入>.number
          type: 收入
          metadata:
              income: <收入>
              type: 收入
          from:
              account: Income:Transfer
          to:
              account: Assets:Bank:CN:CCB:Checking

personalRules:
    - id: 工资收入
      when: (payee ~ "工资" || payee ~ "薪金" || payee ~ "月薪" || payee ~ "年薪") && <收入> != "" && <收入> != "0"
      actions:
          tags:
              - salary
          from:
              account: Income:Work:Salary

    - id: 奖金收入
      when: (payee ~ "奖金" || payee ~ "年终奖" || payee ~ "绩效") && <收入> != "" && <收入> != "0"
      actions:
          tags:
              - bonus
          from:
              account: Income:Work:Bonus

    - id: 投资收入
      when: (payee ~ "基金" || payee ~ "理财" || payee ~ "投资") && <收入> != "" && <收入> != "0"
      actions:
          tags:
              - investment
          from:
              account: Income:Investment:Dividend

    - id: 转账收入
      when: payee ~ "转账" && <收入> != "" && <收入> != "0"
      actions:
          from:
              account: Income:Transfer

    - id: 早餐
      when: (payee ~ "美团" || payee ~ "饿了么" || payee ~ "肯德基" || payee ~ "麦当劳" || payee ~ "星巴克" || payee ~ "咖啡" || payee ~ "奶茶" || payee ~ "餐厅" || payee ~ "饭店" || payee ~ "食堂") && <交易时间> >= "06:00" && <交易时间> <= "11:00" && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - food
              - breakfast
          to:
              account: Expenses:Food:Meal:Breakfast

    - id: 午餐
      when: (payee ~ "美团" || payee ~ "饿了么" || payee ~ "肯德基" || payee ~ "麦当劳" || payee ~ "星巴克" || payee ~ "咖啡" || payee ~ "奶茶" || payee ~ "餐厅" || payee ~ "饭店" || payee ~ "食堂") && <交易时间> >= "11:00" && <交易时间> <= "15:00" && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - food
              - lunch
          to:
              account: Expenses:Food:Meal:Lunch

    - id: 晚餐
      when: (payee ~ "美团" || payee ~ "饿了么" || payee ~ "肯德基" || payee ~ "麦当劳" || payee ~ "星巴克" || payee ~ "咖啡" || payee ~ "奶茶" || payee ~ "餐厅" || payee ~ "饭店" || payee ~ "食堂") && <交易时间> >= "17:00" && <交易时间> <= "22:00" && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - food
              - dinner
          to:
              account: Expenses:Food:Meal:Dinner

    - id: 夜宵
      when: (payee ~ "美团" || payee ~ "饿了么" || payee ~ "肯德基" || payee ~ "麦当劳" || payee ~ "星巴克" || payee ~ "咖啡" || payee ~ "奶茶" || payee ~ "餐厅" || payee ~ "饭店" || payee ~ "食堂") && (<交易时间> >= "22:00" || <交易时间> <= "06:00") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - food
              - snack
          to:
              account: Expenses:Food:Meal:Snack

    - id: 出租车
      when: (payee ~ "滴滴" || payee ~ "高德打车" || payee ~ "出租车" || payee ~ "快车" || payee ~ "专车") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - transport
              - taxi
          to:
              account: Expenses:Transport:Taxi

    - id: 公共交通
      when: (payee ~ "地铁" || payee ~ "公交" || payee ~ "巴士" || payee ~ "公交车") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - transport
              - public
          to:
              account: Expenses:Transport:Public

    - id: 火车
      when: (payee ~ "中国铁路" || payee ~ "12306" || payee ~ "火车" || payee ~ "高铁") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - transport
              - train
          to:
              account: Expenses:Transport:Train

    - id: 航班
      when: (payee ~ "航空公司" || payee ~ "机场" || payee ~ "机票") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - transport
              - flight
          to:
              account: Expenses:Transport:Flight

    - id: 线上购物
      when: (payee ~ "淘宝" || payee ~ "天猫" || payee ~ "京东" || payee ~ "拼多多" || payee ~ "苏宁" || payee ~ "国美") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - shopping
              - online
          to:
              account: Expenses:Shopping:Online

    - id: 日用购物
      when: (payee ~ "超市" || payee ~ "便利店" || payee ~ "沃尔玛" || payee ~ "家乐福" || payee ~ "永辉") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - shopping
              - groceries
          to:
              account: Expenses:Shopping:Groceries

    - id: 生活缴费
      when: (payee ~ "水电费" || payee ~ "电费" || payee ~ "水费" || payee ~ "燃气费" || payee ~ "物业费") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - life
              - utilities
          to:
              account: Expenses:Life:Utilities

    - id: 房租
      when: (payee ~ "房租" || payee ~ "租金" || payee ~ "押金") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - housing
              - rent
          to:
              account: Expenses:Housing:Rent

    - id: 医疗
      when: (payee ~ "医院" || payee ~ "诊所" || payee ~ "药店" || payee ~ "医药") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - health
              - medical
          to:
              account: Expenses:Health:Medical

    - id: 电影
      when: (payee ~ "电影院" || payee ~ "影院" || payee ~ "电影") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - entertainment
              - movie
          to:
              account: Expenses:Entertainment:Movie

    - id: 游戏
      when: (payee ~ "游戏" || payee ~ "手游" || payee ~ "网游") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - entertainment
              - game
          to:
              account: Expenses:Entertainment:Game

    - id: 银行费用
      when: (payee ~ "手续费" || payee ~ "年费" || payee ~ "管理费") && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - bank
              - fees
          to:
              account: Expenses:Bank:Fees

    - id: 信用卡还款
      when: payee ~ "信用卡还款" && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - creditcard
              - payment
          to:
              account: Liabilities:CreditCard:CCB

    - id: 微信提现
      when: payee ~ "微信零钱提现" && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - transfer
              - wechat
          to:
              account: Assets:Digital:WeChat:Cash

    - id: 支付宝提现
      when: payee ~ "支付宝提现" && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - transfer
              - alipay
          to:
              account: Assets:Digital:Alipay:Cash

    - id: 银行转账
      when: (payee ~ "工商银行" || payee ~ "中国银行" || payee ~ "农业银行" || payee ~ "招商银行") && <摘要> ~ "转账" && <支出> != "" && <支出> != "0"
      actions:
          tags:
              - transfer
              - bank
          to:
              account: Assets:Bank:CN:Other

    - id: 忽略第三方支付
      when: (payee ~ "微信支付" || payee ~ "支付宝" || payee ~ "财付通")
      actions:
          ignore: true

    - id: 忽略系统交易
      when: (payee ~ "系统维护" || payee ~ "对账" || payee ~ "冲正")
      actions:
          ignore: true

    - id: 借记卡账户
      when: narration == "借记卡"
      actions:
          from:
              account: Assets:Bank:CN:CCB:DebitCard

    - id: 信用卡账户
      when: narration == "信用卡"
      actions:
          from:
              account: Liabilities:CreditCard:CCB

    - id: 活期账户
      when: narration == "活期"
      actions:
          from:
              account: Assets:Bank:CN:CCB:Checking

    - id: 定期账户
      when: narration == "定期"
      actions:
          from:
              account: Assets:Bank:CN:CCB:TimeDeposit
